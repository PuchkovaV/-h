<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лабораторная работа 9</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="task1">
  <h1>Задание 1. Домик в деревне</h1>
  <div class="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <div class="hill"></div>
    <div class="ground"></div>

    <div class="house">
      <div class="roof"></div>
      <div class="chimney"></div>
      <div class="smoke s1"></div>
      <div class="smoke s2"></div>
      <div class="smoke s3"></div>
      <div class="walls">
        <div class="window">
          <div class="frame-v"></div>
          <div class="frame-h"></div>
        </div>
        <div class="door">
          <div class="handle"></div>
        </div>
      </div>
    </div>

    <div class="tree">
      <div class="trunk"></div>
      <div class="crown cr1"></div>
      <div class="crown cr2"></div>
      <div class="crown cr3"></div>
    </div>

    <div class="fence">
      <div class="plank"></div><div class="plank"></div><div class="plank"></div>
      <div class="plank"></div><div class="plank"></div><div class="plank"></div>
      <div class="rail r1"></div>
      <div class="rail r2"></div>
    </div>

    <div class="path"></div>
    <div class="flower f1"></div>
    <div class="flower f2"></div>
    <div class="flower f3"></div>
  </div>
</section>

<section class="task2">
  <h1>Задание 2. Маятник Ньютона</h1>
  <div class="cradle">
    <div class="bar"></div>
    <div class="post left"></div>
    <div class="post right"></div>
    <div class="base"></div>

    <div class="balls">
      <div class="pendulum first"><div class="string"></div><div class="ball"></div></div>
      <div class="pendulum"><div class="string"></div><div class="ball"></div></div>
      <div class="pendulum"><div class="string"></div><div class="ball"></div></div>
      <div class="pendulum"><div class="string"></div><div class="ball"></div></div>
      <div class="pendulum last"><div class="string"></div><div class="ball"></div></div>
    </div>
  </div>
  <p>Наведите курсор на маятник, чтобы поставить анимацию на паузу.</p>
</section>
</body>
</html>
