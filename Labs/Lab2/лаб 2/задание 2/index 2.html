<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox — Вариант 15</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Вариант 15: блоки 0 - 4 - 1 - 2 - 3 -->

<div class="container">

    <!-- БЛОК 1 (вариант 0) -->
    <div class="section section-1">
        <div class="cell red-light"></div>
        <div class="cell red"></div>
        <div class="cell red-dark"></div>
    </div>


    <!-- БЛОК 2 (вариант 4) -->
    <div class="section section-2">

        <div class="pink-left">
            <div class="cell pink-light"></div>
            <div class="cell pink"></div>
        </div>

        <div class="cell pink-dark"></div>

    </div>


    <!-- БЛОК 3 (вариант 1) -->
    <div class="section section-3">

        <div class="green-left">
            <div class="green-row">
                <div class="cell narrow lime-green"></div>
                <div class="cell wide spring-green"></div>
            </div>
            <div class="green-row">
                <div class="cell wide sea-green"></div>
                <div class="cell narrow dark-green"></div>
            </div>
            <div class="green-row">
                <div class="cell narrow yellow-green"></div>
                <div class="cell wide olive"></div>
            </div>
        </div>

        <div class="green-right">
            <div class="cell green-yellow"></div>
            <div class="cell green-bright"></div>
        </div>

    </div>


    <!-- БЛОК 4 (вариант 2) -->
    <div class="section section-4">
        <div class="cell orange-light"></div>
        <div class="cell orange-red"></div>
        <div class="cell orange"></div>
    </div>


    <!-- БЛОК 5 (вариант 3) -->
    <div class="section section-5">

        <div class="brown-left">
            <div class="cell brown-light"></div>
            <div class="cell sand"></div>
        </div>

        <div class="cell brown-orange"></div>

        <div class="brown-right">
            <div class="cell brown"></div>
            <div class="brown-bottom">
                <div class="cell brown-red"></div>
                <div class="cell dark-brown"></div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
