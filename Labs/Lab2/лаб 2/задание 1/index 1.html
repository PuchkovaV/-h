
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 1</title>

    <style>
        .screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .numbers {
            display: flex;
            gap: 40px;
        }

        .digit {
            display: flex;
            flex-direction: column;
        }

        .row {
            display: flex;
        }

        .square {
            width: 40px;
            height: 40px;
            background: #000;
        }

        .empty {
            width: 40px;
            height: 40px;
        }
    </style>
</head>

<body>

<div class="screen">

    <div class="numbers">

        <!-- Цифра 0 -->
        <div class="digit">

            <div class="row">
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
            </div>

            <div class="row">
                <div class="square"></div>
                <div class="empty"></div>
                <div class="square"></div>
            </div>

            <div class="row">
                <div class="square"></div>
                <div class="empty"></div>
                <div class="square"></div>
            </div>

            <div class="row">
                <div class="square"></div>
                <div class="empty"></div>
                <div class="square"></div>
            </div>

            <div class="row">
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
            </div>

        </div>


        <!-- Цифра 4 -->
        <div class="digit">

            <div class="row">
                <div class="square"></div>
                <div class="empty"></div>
                <div class="square"></div>
            </div>

            <div class="row">
                <div class="square"></div>
                <div class="empty"></div>
                <div class="square"></div>
            </div>

            <div class="row">
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
            </div>

            <div class="row">
                <div class="empty"></div>
                <div class="empty"></div>
                <div class="square"></div>
            </div>

            <div class="row">
                <div class="empty"></div>
                <div class="empty"></div>
                <div class="square"></div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
