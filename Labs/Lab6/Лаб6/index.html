<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ одежды</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">

    <h1>Оформление заказа</h1>

    <!-- novalidate: проверку делаем сами на JavaScript -->
    <form id="orderForm" novalidate>

        <fieldset>
            <legend>Покупатель</legend>

            <div class="field">
                <label for="name">Имя: <span class="req">*</span></label>
                <input type="text" id="name" name="name" placeholder="Введите имя">
            </div>
            <div class="error" id="name-error"></div>

            <div class="field">
                <label for="email">Электронная почта: <span class="req">*</span></label>
                <input type="email" id="email" name="email" placeholder="Введите email">
            </div>
            <div class="error" id="email-error"></div>

            <div class="field">
                <label for="phone">Телефон: <span class="req">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="+7 900 000-00-00">
            </div>
            <div class="error" id="phone-error"></div>

        </fieldset>


        <fieldset>
            <legend>Товар</legend>

            <div class="field">
                <label for="clothes">Одежда: <span class="req">*</span></label>
                <select id="clothes" name="clothes">
                    <option value="">— выберите —</option>
                    <option>Футболка</option>
                    <option>Худи</option>
                    <option>Джинсы</option>
                    <option>Куртка</option>
                </select>
            </div>
            <div class="error" id="clothes-error"></div>

            <div class="field">
                <label for="size">Размер: <span class="req">*</span></label>
                <select id="size" name="size">
                    <option value="">— выберите —</option>
                    <option>XS</option>
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                </select>
            </div>
            <div class="error" id="size-error"></div>

            <div class="field">
                <label for="quantity">Количество: <span class="req">*</span></label>
                <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
            </div>
            <div class="error" id="quantity-error"></div>

        </fieldset>


        <fieldset>
            <legend>Доставка</legend>

            <div class="choice">
                <p>Способ доставки:</p>

                <label>
                    <input type="radio" name="delivery" value="Курьер" checked>
                    Курьер
                </label>

                <label>
                    <input type="radio" name="delivery" value="Самовывоз">
                    Самовывоз
                </label>
            </div>

            <div class="field">
                <label for="address">Адрес: <span class="req">*</span></label>
                <textarea id="address" name="address" placeholder="Введите адрес доставки"></textarea>
            </div>
            <div class="error" id="address-error"></div>

        </fieldset>


        <fieldset>
            <legend>Оплата</legend>

            <div class="choice">
                <p>Способ оплаты:</p>

                <label>
                    <input type="radio" name="payment" value="Банковская карта" checked>
                    Банковская карта
                </label>

                <label>
                    <input type="radio" name="payment" value="Наличными">
                    Наличными
                </label>
            </div>

            <div class="agreement">
                <input type="checkbox" id="agree" name="agree">
                <label for="agree">Согласен с условиями заказа <span class="req">*</span></label>
            </div>
            <div class="error" id="agree-error"></div>

        </fieldset>

        <p class="note"><span class="req">*</span> — обязательные поля</p>

        <div class="buttons">
            <button type="submit">Оформить заказ</button>
            <button type="reset">Очистить</button>
        </div>

    </form>

    <!-- Сюда выводятся данные после успешной отправки -->
    <div id="result" class="result hidden"></div>

</div>

<script src="script.js"></script>
</body>
</html>
