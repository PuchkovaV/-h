<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ одежды</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">

    <h1>Оформление заказа</h1>

    <form>

        <fieldset>
            <legend>Покупатель</legend>

            <div class="field">
                <label for="name">Имя:</label>
                <input type="text" id="name" placeholder="Введите имя">
            </div>

            <div class="field">
                <label for="email">Электронная почта:</label>
                <input type="email" id="email" placeholder="Введите email">
            </div>

            <div class="field">
                <label for="phone">Телефон:</label>
                <input type="tel" id="phone" placeholder="+7 900 000-00-00">
            </div>

        </fieldset>


        <fieldset>
            <legend>Товар</legend>

            <div class="field">
                <label for="clothes">Одежда:</label>

                <select id="clothes">
                    <option>Футболка</option>
                    <option>Худи</option>
                    <option>Джинсы</option>
                    <option>Куртка</option>
                </select>
            </div>

            <div class="field">
                <label for="size">Размер:</label>

                <select id="size">
                    <option>XS</option>
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                </select>
            </div>

            <div class="field">
                <label for="quantity">Количество:</label>

                <input type="number" id="quantity" min="1" max="10" value="1">
            </div>

        </fieldset>


        <fieldset>
            <legend>Доставка</legend>

            <div class="field">
                <label for="address">Адрес:</label>

                <textarea id="address" placeholder="Введите адрес доставки"></textarea>
            </div>

            <div class="choice">
                <p>Способ доставки:</p>

                <label>
                    <input type="radio" name="delivery" value="courier" checked>
                    Курьер
                </label>

                <label>
                    <input type="radio" name="delivery" value="pickup">
                    Самовывоз
                </label>
            </div>

        </fieldset>


        <fieldset>
            <legend>Оплата</legend>

            <div class="choice">
                <p>Способ оплаты:</p>

                <label>
                    <input type="radio" name="payment" value="card" checked>
                    Банковская карта
                </label>

                <label>
                    <input type="radio" name="payment" value="cash">
                    Наличными
                </label>
            </div>

            <div class="agreement">
                <input type="checkbox" id="agree">
                <label for="agree">Согласен с условиями заказа</label>
            </div>

        </fieldset>


        <div class="buttons">
            <button type="submit">Оформить заказ</button>
            <button type="reset">Очистить</button>
        </div>

    </form>

</div>

</body>
</html>
